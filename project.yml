name: EveryTime
options:
  bundleIdPrefix: com.solomonxie.everytime
  deploymentTarget:
    iOS: "18.0"
    watchOS: "10.0"
# Store region per install: `make <target> STORE=cn` (default us = Canada/US). Read via StoreRegion.current.
# DEVELOPMENT_TEAM: gitignored Local.xcconfig via Signing.xcconfig (see Local.xcconfig.example). Never set it here.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    STORE: us
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EveryTime:
    type: application
    platform: iOS
    sources:
      - path: EveryTime
        excludes:
          - "**/README.md"
          - "Info.plist"
          - "EveryTime.entitlements"
          # Boards on hold for 1.0 (Reminders access); drop this line, the test excludes and re-add AppTool.boards to ship it.
          - "Features/Boards/**"
      - Glance
      # Demo mode's preset data (More → Demo).
      - path: demo
        type: folder
        buildPhase: resources
    info:
      path: EveryTime/Info.plist
      properties:
        CFBundleDisplayName: Every Time
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        AppStoreRegion: $(STORE)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCalendarsWriteOnlyAccessUsageDescription: Adds your lunar events to the iPhone Calendar.
        NSCalendarsFullAccessUsageDescription: Finds events in your calendar to mark as important and adds lunar events.
        NSHealthShareUsageDescription: Shows your past nights of sleep from the Health app.
        NSAlarmKitUsageDescription: Wakes you at the end of a nap, even in silent mode.
        # Keeps a nap alarm able to ring through the silent switch while the app is in the background.
        UIBackgroundModes: [audio]
        # Makes the iCloud folder visible in Files, so backups there can be got at.
        NSUbiquitousContainers:
          iCloud.com.solomonxie.everytime:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Every Time
            NSUbiquitousContainerSupportedFolderLevels: Any
    # iCloud Drive backup needs a paid team; pass DEVELOPMENT_TEAM on the build command.
    entitlements:
      path: EveryTime/EveryTime.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.solomonxie.everytime]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.solomonxie.everytime]
        com.apple.security.application-groups: [group.com.solomonxie.everytime]
        com.apple.developer.healthkit: true
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      - target: EveryTimeWidgetExtension
        embed: true
      - target: EveryTimeWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solomonxie.everytime
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        # AlarmKit is iOS 26+; weak so the app still launches on iOS 18.
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "AlarmKit"]
    scheme:
      testTargets:
        - EveryTimeTests

  EveryTimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EveryTimeTests
        excludes:
          - "Board*.swift"
    dependencies:
      - target: EveryTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solomonxie.everytime.tests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EveryTime.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/EveryTime"
        BUNDLE_LOADER: "$(TEST_HOST)"

  EveryTimeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: EveryTimeWidget
        excludes:
          - "Info.plist"
          - "EveryTimeWidget.entitlements"
      - Glance
      - EveryTime/Models/WorldCity.swift
    entitlements:
      path: EveryTimeWidget/EveryTimeWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.solomonxie.everytime]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solomonxie.everytime.widget
        PRODUCT_NAME: EveryTimeWidget
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: EveryTimeWidget/Info.plist
        SKIP_INSTALL: "YES"

  EveryTimeWatch:
    type: application
    platform: watchOS
    sources:
      - path: EveryTimeWatch
      - Glance
      - EveryTime/Models/WorldCity.swift
      - EveryTime/Models/SleepSuggestion.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solomonxie.everytime.watch
        PRODUCT_NAME: EveryTimeWatch
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Every Time
        INFOPLIST_KEY_WKApplication: "YES"
        INFOPLIST_KEY_WKWatchOnly: "NO"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.solomonxie.everytime
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
