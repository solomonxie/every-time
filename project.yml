name: EveryTime
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
# Store region per install: `make <target> STORE=cn` (default us = Canada/US). Read via StoreRegion.current.
# DEVELOPMENT_TEAM and APP_BUNDLE_ID: gitignored Local.xcconfig via Signing.xcconfig (see Local.xcconfig.example). Never set them here.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    STORE: us
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EveryTime:
    type: application
    platform: iOS
    sources:
      - path: EveryTime
        excludes:
          - "**/README.md"
          - "Info.plist"
          - "EveryTime.entitlements"
          # Boards on hold for 1.0 (Reminders access); drop this line, the test excludes and re-add AppTool.boards to ship it.
          - "Features/Boards/**"
      - Glance
      # Demo mode's preset data (More → Demo).
      - path: demo
        type: folder
        buildPhase: resources
    info:
      path: EveryTime/Info.plist
      properties:
        CFBundleDisplayName: Every Time
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        AppStoreRegion: $(STORE)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCalendarsWriteOnlyAccessUsageDescription: Adds your lunar events to the iPhone Calendar.
        NSCalendarsFullAccessUsageDescription: Finds events in your calendar to mark as important and adds lunar events.
        NSHealthShareUsageDescription: Shows your past nights of sleep from the Health app.
        NSHealthUpdateUsageDescription: Every Time never writes to the Health app. It only reads your sleep.
        NSAlarmKitUsageDescription: Wakes you at the end of a nap, even in silent mode.
        # Keeps a nap alarm able to ring through the silent switch while the app is in the background.
        UIBackgroundModes: [audio]
        # Read at runtime (AppIdentifier) so the source never hardcodes the bundle id.
        AppGroupIdentifier: group.$(APP_BUNDLE_ID)
        ICloudContainerIdentifier: iCloud.$(APP_BUNDLE_ID)
        # Makes the iCloud folder visible in Files, so backups there can be got at.
        NSUbiquitousContainers:
          iCloud.$(APP_BUNDLE_ID):
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Every Time
            NSUbiquitousContainerSupportedFolderLevels: Any
    # iCloud Drive backup needs a paid team; pass DEVELOPMENT_TEAM on the build command.
    entitlements:
      path: EveryTime/EveryTime.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.$(APP_BUNDLE_ID)]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.$(APP_BUNDLE_ID)]
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
        com.apple.developer.healthkit: true
        com.apple.developer.usernotifications.time-sensitive: true
    dependencies:
      - target: EveryTimeWidgetExtension
        embed: true
    # Xcode expands $(…) in plist values but not in dictionary keys; rename the NSUbiquitousContainers key before signing.
    postBuildScripts:
      - name: Resolve NSUbiquitousContainers key
        basedOnDependencyAnalysis: false
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          from='iCloud.$(APP_BUNDLE_ID)'; to="iCloud.$APP_BUNDLE_ID"
          /usr/libexec/PlistBuddy -c "Print :NSUbiquitousContainers:$from" "$plist" >/dev/null 2>&1 || exit 0
          /usr/libexec/PlistBuddy -c "Copy :NSUbiquitousContainers:$from :NSUbiquitousContainers:$to" -c "Delete :NSUbiquitousContainers:$from" "$plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        # AlarmKit is iOS 26+; weak so the app still launches on iOS 18.
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "AlarmKit"]
    scheme:
      testTargets:
        - EveryTimeTests

  EveryTimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EveryTimeTests
        excludes:
          - "Board*.swift"
    dependencies:
      - target: EveryTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EveryTime.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/EveryTime"
        BUNDLE_LOADER: "$(TEST_HOST)"

  EveryTimeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: EveryTimeWidget
        excludes:
          - "Info.plist"
          - "EveryTimeWidget.entitlements"
      - Glance
      - EveryTime/Models/WorldCity.swift
      - EveryTime/Models/WorldCityData.swift
    entitlements:
      path: EveryTimeWidget/EveryTimeWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        PRODUCT_NAME: EveryTimeWidget
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: EveryTimeWidget/Info.plist
        SKIP_INSTALL: "YES"
