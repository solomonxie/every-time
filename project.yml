name: EveryTime
options:
  bundleIdPrefix: com.solomonxie.everytime
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
targets:
  EveryTime:
    type: application
    platform: iOS
    sources:
      - path: EveryTime
        excludes:
          - "**/README.md"
    dependencies:
      - target: EveryTimeWidgetExtension
        embed: true
      - target: EveryTimeWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solomonxie.everytime
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"

  EveryTimeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: EveryTimeWidget
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solomonxie.everytime.widget
        PRODUCT_NAME: EveryTimeWidget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: EveryTimeWidget/Info.plist
        SKIP_INSTALL: "YES"

  EveryTimeWatch:
    type: application
    platform: watchOS
    sources:
      - path: EveryTimeWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solomonxie.everytime.watch
        PRODUCT_NAME: EveryTimeWatch
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_WKApplication: "YES"
        INFOPLIST_KEY_WKWatchOnly: "NO"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
